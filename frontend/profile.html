<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Campus Problem Reporting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand"><i class="fa-solid fa-building-shield"></i> Campus Reporting</div>
        <div class="navbar-links">
            <a href="student-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <h1>My Profile</h1>
        <p class="subtitle">View and update your account information</p>

        <div class="form-card">
            <div class="profile-avatar">
                <i class="fa-solid fa-circle-user"></i>
            </div>

            <label for="profileName">Full Name</label>
            <input type="text" id="profileName" name="profileName">

            <label for="profileEmail">Email</label>
            <input type="email" id="profileEmail" name="profileEmail" disabled>

            <label for="profileRole">Role</label>
            <input type="text" id="profileRole" name="profileRole" disabled>

            <label for="newPassword">New Password (leave blank to keep current)</label>
            <input type="password" id="newPassword" name="newPassword">

            <button type="button" id="saveProfileBtn" class="btn-primary" style="margin-top: 20px; width: 100%;">
                Save Changes
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service worker registered'))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>
</body>
</html>
