<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints - Campus Problem Reporting</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>

    <nav class="navbar">
    <div class="navbar-brand"><i class="fa-solid fa-building-shield"></i> Campus Reporting</div>
    <div class="navbar-links">
        <a href="student-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="submit-complaint.html"><i class="fa-solid fa-circle-plus"></i> Submit Complaint</a>
        <a href="my-complaints.html"><i class="fa-solid fa-list-check"></i> My Complaints</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</nav>

    

    <div class="page-container">
        <h1>My Complaints</h1>
        <p class="subtitle">Track the status of all your submitted complaints</p>

        <!-- This table will be filled dynamically with JavaScript later (Phase 9) -->
        <table class="complaints-table">
            <thead>
                <tr>
                    <th>Complaint ID</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Submitted On</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="complaintsTableBody">
                <!-- Example placeholder row, will be replaced by real data later -->
                <tr>
                    <td colspan="6" class="empty-message">No complaints submitted yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="js/api.js"></script>
    <script src="js/my-complaints.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service worker registered'))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>
</body>
</html>
