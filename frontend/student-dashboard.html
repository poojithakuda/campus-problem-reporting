<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Campus Problem Reporting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>

    <nav class="navbar">
    <div class="navbar-brand"><i class="fa-solid fa-building-shield"></i> Campus Reporting</div>
    <div class="navbar-links">
        <a href="student-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="submit-complaint.html"><i class="fa-solid fa-circle-plus"></i> Submit Complaint</a>
        <a href="my-complaints.html"><i class="fa-solid fa-list-check"></i> My Complaints</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</nav>

    
    

    <div class="page-container">
        <h1>Welcome, <span id="studentName">Student</span></h1>
        <p class="subtitle">Here's a summary of your complaints</p>

        <!-- Summary cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalCount">0</h3>
                <p>Total Complaints</p>
            </div>
            <div class="stat-card">
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <h3 id="progressCount">0</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card">
                <h3 id="resolvedCount">0</h3>
                <p>Resolved</p>
            </div>
        </div>

        <a href="submit-complaint.html" class="btn-primary">+ Submit New Complaint</a>
    </div>

    <script src="js/api.js"></script>
    <script src="js/student-dashboard.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service worker registered'))
      .catch(err => console.error('Service worker registration failed:', err));
  }
</script>
</body>
</html>
