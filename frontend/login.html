<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Problem Reporting</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>

    <div class="auth-container">
        <h1>Campus Problem Reporting</h1>
        <h2>Login</h2>

        <div class="role-toggle">
            <button type="button" class="role-btn active" data-role="student">Student</button>
            <button type="button" class="role-btn" data-role="staff">Staff</button>
        </div>

        <form id="loginForm">
            <input type="hidden" id="selectedRole" value="student">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('Service worker registered'))
          .catch(err => console.error('Service worker registration failed:', err));
      }
    </script>
</body>
</html>
